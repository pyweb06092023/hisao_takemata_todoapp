<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">ToDo削除確認</h1>
        <p class="confirm-value">やること：<span th:text="${#strings.isEmpty(todo.title) ? '（未入力）' : todo.title}">（未入力）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${#strings.isEmpty(todo.category) ? '（未入力）' : todo.category}">（未入力）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（未入力）' : todo.dueDate}">（未入力）</span></p>

        <form th:action="@{/todos/{id}/delete(id=${id})}" method="post">
            <div class="confirm-actions">
                <button class="btn" type="submit">消す</button>
                <a class="btn sub" href="/todos">やめる</a>
            </div>
        </form>
    </div>
</body>
</html>
