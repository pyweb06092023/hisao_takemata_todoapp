<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo登録確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">ToDo登録確認</h1>
        <p class="confirm-value">やること：<span th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}">（入力なし）</span></p>
        <p class="confirm-value">メモ：<span th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}">（入力なし）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}">（入力なし）</span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == null ? '（入力なし）' : (todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低'))}">（入力なし）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">（入力なし）</span></p>

        <form th:action="@{/todos}" method="post">
            <input type="hidden" name="title" th:value="${todo.title}">
            <input type="hidden" name="detail" th:value="${todo.detail}">
            <input type="hidden" name="category" th:value="${todo.category}">
            <input type="hidden" name="priority" th:value="${todo.priority}">
            <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
            <div class="confirm-actions">
                <button class="btn" type="submit">登録する</button>
            </div>
        </form>

        <form th:action="@{/todos/new}" method="post">
            <input type="hidden" name="title" th:value="${todo.title}">
            <input type="hidden" name="detail" th:value="${todo.detail}">
            <input type="hidden" name="category" th:value="${todo.category}">
            <input type="hidden" name="priority" th:value="${todo.priority}">
            <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
            <div class="confirm-actions">
                <button class="btn sub" type="submit">書き直す</button>
            </div>
        </form>
    </div>
</body>
</html>
