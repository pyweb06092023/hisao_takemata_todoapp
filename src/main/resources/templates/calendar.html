<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <h1 class="page-title"><span th:text="${year}">2026</span>年<span th:text="${month}">4</span>月</h1>
        <div class="calendar-navigation">
            <div class="calendar-navigation-left">
            <a class="btn sub" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
            <a class="btn sub" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
            </div>
            <div class="calendar-navigation-right">
                <a class="btn sub" href="/todos">表で見る</a>
                <a class="btn sub" href="/todos/new">新規登録</a>
            </div>
        </div>
        <div class="holidays-unavailable" hidden>祝日を取れませんでした</div>
        <table class="calendar-table" th:attr="data-from=${from},data-to=${to}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <th:block th:each="date : ${week}">
                        <td th:if="${date != null}" th:attr="data-date=${date}" th:text="${date.dayOfMonth}"></td>
                        <td th:if="${date == null}"></td>
                    </th:block>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        async function loadTodos() {
            const calendarTable = document.querySelector('.calendar-table');
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const res = await fetch(`/api/todos?from=${from}&to=${to}`);
            const todos = await res.json();

            calendarTable.querySelectorAll('[data-date]').forEach(cell => {
                const matchingTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                matchingTodos.slice(0, 3).forEach(todo => {
                    const todoName = document.createElement('a');
                    todoName.href = `/todos/${todo.id}/edit`;
                    todoName.className = 'link';
                    todoName.style.display = 'block';
                    todoName.textContent = todo.title;
                    if (todo.dueDate < today && !todo.completed) {
                        todoName.style.color = 'red';
                    }
                    cell.appendChild(todoName);
                });

                if (matchingTodos.length > 3) {
                    const remaining = document.createElement('div');
                    remaining.textContent = `ほか ${matchingTodos.length - 3}件`;
                    cell.appendChild(remaining);
                }
            });
        }

        async function loadHolidays() {
            const calendarTable = document.querySelector('.calendar-table');
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const res = await fetch(`/api/holidays?from=${from}&to=${to}`);

            if (res.headers.has('X-Holidays-Unavailable')) {
                document.querySelector('.holidays-unavailable').hidden = false;
            }

            const holidays = await res.json();
            calendarTable.querySelectorAll('[data-date]').forEach(cell => {
                const date = new Date(`${cell.dataset.date}T00:00:00`);
                const holidayName = holidays[cell.dataset.date];

                if (holidayName) {
                    cell.style.backgroundColor = '#ffe0e0';
                    cell.title = holidayName;
                } else if (date.getDay() === 0) {
                    cell.style.backgroundColor = '#fff0f0';
                } else if (date.getDay() === 6) {
                    cell.style.backgroundColor = '#eaf3ff';
                }
            });
        }

        async function loadWeather() {
            const calendarTable = document.querySelector('.calendar-table');
            try {
                const from = calendarTable.dataset.from;
                const to = calendarTable.dataset.to;
                const res = await fetch(`/api/weather?from=${from}&to=${to}`);
                if (!res.ok) return;
                const weather = await res.json();
                calendarTable.querySelectorAll('[data-date]').forEach(cell => {
                    const text = weather[cell.dataset.date];
                    if (!text) return;
                    const weatherText = document.createElement('div');
                    weatherText.textContent = text;
                    weatherText.className = 'weather';
                    cell.appendChild(weatherText);
                });
            } catch (error) {
                // 天気が取れない場合も、カレンダー表示は続ける
            }
        }

        loadTodos();
        loadHolidays();
        loadWeather();
    </script>
</body>

</html>
